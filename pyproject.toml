[project]
name = "update-runner"
version = "0.0.0"
description = "Linuxで動作するOTA実行エンジン"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
maintainers = [{name = "kojiron"}]
requires-python = ">=3.10"

[project.optional-dependencies]
tests = [
    "pytest",
]
dev = [
    "ruff",
    "tox",
]

[project.scripts]
update_runner="update_runner.main:run"

[build-system]
requires = [
	"setuptools>=77",
	"setuptools_scm[toml]>=3.4.1",
]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.10"
files = ["src"]
show_error_codes = true
pretty = true
strict = true

[[tool.mypy.overrides]]
ignore_missing_imports = true

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]
